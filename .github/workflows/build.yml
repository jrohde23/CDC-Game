name: Build N64 ROM
on: [push]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build with Libdragon
        # Use the master branch of the official action
        uses: DragonMinded/libdragon@master
        with:
          run: |
            make
            
      - name: Upload ROM
        uses: actions/upload-artifact@v4
        with:
          name: VibePong-ROM
          path: vibepong.z64