name: Build N64 ROM
on: [push]
jobs:
  build-rom:
    runs-on: ubuntu-latest
    container: ghcr.io/dragonminded/libdragon:latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v3
      - name: Compile ROM
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          make
      - name: Upload ROM
        uses: actions/upload-artifact@v4
        with:
          name: n64-rom
          path: vibepong.z64