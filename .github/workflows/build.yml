name: Build N64 ROM
on: [push]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Libdragon
        run: |
          # Download the pre-compiled toolchain for Linux
          sudo mkdir -p /opt/libdragon
          sudo chown $USER /opt/libdragon
          curl -L https://github.com/DragonMinded/libdragon/releases/download/nightly/libdragon-docker-bin.tar.gz | tar -xz -C /opt/libdragon
          
      - name: Build ROM
        run: |
          export N64_INST=/opt/libdragon
          export PATH=$PATH:$N64_INST/bin
          mkdir -p build
          make
          
      - name: Upload ROM
        uses: actions/upload-artifact@v4
        with:
          name: VibePong-ROM
          path: vibepong.z64